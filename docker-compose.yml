services:
  sic-lai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sic-lai-service
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-nvidia/nemotron-3.5-super-vl:free}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-120}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-4096}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONITORING_LOG_PATH: /app/logs/requests.jsonl
      MONITORING_MAX_BYTES: ${MONITORING_MAX_BYTES:-10000000}
      MONITORING_BACKUPS: ${MONITORING_BACKUPS:-5}
    volumes:
      - ./logs:/app/logs
      - ./monitoring/generated:/app/monitoring/generated
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
