services:
  sic-lai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sic-lai-service
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MODEL_NAME=Qwen/Qwen2.5-0.5B-Instruct
      - DEVICE=cpu
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
